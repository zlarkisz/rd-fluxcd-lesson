# =============================================================================
# kustomization.yaml — INFRASTRUCTURE: controllers (агрегатор)
# =============================================================================
# Об'єднує всі контролери інфраструктури в один набір.
# Зараз тут лише dragonfly. Якщо завтра додаси cert-manager, ingress-nginx,
# external-dns — додаси їх сюди як ще один рядок у resources.
#
# Це "точка входу", на яку посилатиметься Flux Kustomization з
# clusters/my-cluster/infrastructure.yaml.
# =============================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - dragonfly
