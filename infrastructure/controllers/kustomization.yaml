# =============================================================================
# kustomization.yaml — INFRASTRUCTURE: controllers (агрегатор)
# =============================================================================
# Об'єднує всі контролери інфраструктури в один набір.
# Це "точка входу", на яку посилатиметься Flux Kustomization з
# clusters/my-cluster/infrastructure.yaml.
# =============================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - dragonfly         # Dragonfly Operator (потрібен для apps/overlays/*)
  - metrics-server    # потрібен для HPA в production
