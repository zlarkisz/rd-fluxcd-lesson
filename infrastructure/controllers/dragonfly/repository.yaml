# =============================================================================
# HelmRepository: dragonfly-operator
# =============================================================================
# Аналог "helm repo add dragonfly-operator oci://ghcr.io/...".
# Каже Flux джерело, звідки тягнути чарт.
#
# type: oci — OCI Helm chart (сучасний формат, лежить у container registry,
#             не в HTTP-репозиторії з index.yaml).
#
# Чому в namespace flux-system?
# - HelmRepository — це джерело даних, ним керує source-controller Flux.
# - Конвенція: всі джерела (HelmRepository, GitRepository, OCIRepository)
#   живуть у flux-system, поряд із самим Flux.
# - Звідти на них можна посилатися з будь-яких HelmRelease в інших ns.
#
# interval: 30m — як часто Flux перевіряє чи є нова версія чарту.
# =============================================================================
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: dragonfly-operator
  namespace: flux-system
spec:
  type: oci
  interval: 30m
  url: oci://ghcr.io/dragonflydb/dragonfly-operator/helm
