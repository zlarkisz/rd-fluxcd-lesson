# =============================================================================
# kustomization.yaml — INFRASTRUCTURE: Dragonfly Operator
# =============================================================================
# Об'єднує три ресурси:
#   1. Namespace для оператора
#   2. HelmRepository (звідки тягнути чарт)
#   3. HelmRelease (інструкція встановити чарт)
#
# Цей "набір" Flux застосує одним блоком, коли в clusters/my-cluster/
# з'явиться Kustomization, що вкаже на цю папку (зробимо на Етапі 5).
# =============================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - repository.yaml
  - release.yaml
