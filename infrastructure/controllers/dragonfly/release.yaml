# =============================================================================
# HelmRelease: dragonfly-operator
# =============================================================================
# Аналог "helm install dragonfly-operator <chart> --version X -n Y".
# Flux helm-controller прочитає це, скачає чарт через HelmRepository вище,
# і встановить в кластер. Якщо ми пізніше підвищимо version — Flux зробить
# helm upgrade автоматично.
#
# install.crds: Create — при першій інсталяції чарту встановити CRD
# (CustomResourceDefinition). Без цього не з'явиться "kind: Dragonfly".
# upgrade.crds: CreateReplace — при оновленні чарту також оновлювати CRD.
#
# install.createNamespace: false — намеспейс уже створили у namespace.yaml,
# щоб мати ним явно повний контроль (labels, тощо).
# =============================================================================
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dragonfly-operator
  namespace: dragonfly-operator-system
spec:
  # Як часто перевіряти стан і робити reconcile.
  interval: 30m

  chart:
    spec:
      chart: dragonfly-operator
      # Пінимо мажорну версію — отримуємо patch-апдейти автоматично,
      # але без сюрпризів з major upgrade. Можна також "v1.5.0" жорстко.
      version: "v1.x"
      sourceRef:
        kind: HelmRepository
        name: dragonfly-operator
        namespace: flux-system
      interval: 12h

  install:
    crds: Create
    createNamespace: false
    remediation:
      retries: 3

  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3

  # Кастомні values для чарту. Поки залишаємо дефолти —
  # оператор працює "з коробки" нормально. Якщо знадобиться щось підкрутити
  # (resources, replicaCount оператора, тощо) — додаємо сюди.
  values: {}
