# =============================================================================
# kustomization.yaml — OVERLAY: development
# =============================================================================
# Найважливіший файл overlay. Робить 3 речі:
#   1. Підтягує base (через resources: - ../../base)
#   2. Додає dev-специфічні ресурси (Namespace, Dragonfly CR)
#   3. Призначає всім ресурсам namespace=development через єдине поле
#
# Як рендерити локально:
#   kubectl kustomize apps/overlays/development/
# Або застосувати в кластер:
#   kubectl apply -k apps/overlays/development/
# =============================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# -----------------------------------------------------------------------------
# Namespace для всіх ресурсів цього overlay.
# Kustomize пропише metadata.namespace = "development" КОЖНОМУ ресурсу,
# який не має свого namespace явно прописаним.
#
# Тому namespace.yaml сам по собі (k8s Namespace — cluster-scoped) це
# поле ігнорує, а Deployment/Service/Ingress/Dragonfly отримають його.
# -----------------------------------------------------------------------------
namespace: development

# -----------------------------------------------------------------------------
# Ресурси: base + локальні файли цього overlay.
# Порядок не важливий — Kustomize розумно розв'язує залежності.
# -----------------------------------------------------------------------------
resources:
  - ../../base       # підтягує deployment, service, ingress з base
  - namespace.yaml   # створює сам Namespace
  - dragonfly.yaml   # Dragonfly CR (буде розгорнутий оператором)

# -----------------------------------------------------------------------------
# Лейбли, унікальні для цього environment.
# Додаються до УСІХ ресурсів (включно з тими що з base).
# Корисно для:
#   kubectl get all -A -l environment=development
# -----------------------------------------------------------------------------
labels:
  - pairs:
      environment: development

# -----------------------------------------------------------------------------
# Патчі — перевизначення полів у ресурсах з base.
#
# Тут replicas=1 для course-app. Хоча в base і так 1, явно вказуємо,
# бо це "контракт середовища" — читач overlay одразу бачить що для dev
# одна репліка, без необхідності лізти в base.
#
# Синтаксис: strategic merge patch (нативний для K8s) — пишемо тільки те,
# що змінюється, K8s сам мерджить з оригінальним маніфестом.
# -----------------------------------------------------------------------------
patches:
  - target:
      kind: Deployment
      name: course-app
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
