# =============================================================================
# Namespace: production
# =============================================================================
# Окремий простір імен для prod-середовища. Логіка та сама, що і в dev:
# Kustomize пропише namespace= ресурсам, але сам Namespace треба
# створювати явним ресурсом.
# =============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: production
  labels:
    environment: production
    app.kubernetes.io/managed-by: flux
