# =============================================================================
# HorizontalPodAutoscaler: course-app — PRODUCTION
# =============================================================================
# Автоматично масштабує Deployment course-app залежно від навантаження.
#
# Як працює:
#   - Кожні ~15 секунд читає метрики (CPU/memory) з metrics-server
#   - Якщо середній CPU подів > 70% від requests → додає поди (до maxReplicas)
#   - Якщо < 70% протягом 5 хвилин → прибирає (до minReplicas)
#   - Зміна кількості реплік відбувається через scale subresource Deployment
#
# ⚠️ ВАЖЛИВО: HPA працює тільки якщо у Deployment прописані
#    resources.requests.cpu/memory (бо HPA рахує % від requests, не від limits).
#    Це робимо patch'ем у kustomization.yaml цього overlay.
#
# ⚠️ HPA читає метрики з metrics-server. Якщо в кластері немає
#    metrics-server (за замовчуванням немає в Docker Desktop), HPA створиться,
#    але в колонці TARGETS буде "<unknown>" і скейлити не буде.
#    Встановити: див. кінець README домашки.
# =============================================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: course-app
  labels:
    app.kubernetes.io/name: course-app
    app.kubernetes.io/component: web
spec:
  # ---------------------------------------------------------------------------
  # scaleTargetRef — що саме масштабувати.
  # Вказує на наш Deployment course-app у тому ж namespace.
  # ---------------------------------------------------------------------------
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: course-app

  # ---------------------------------------------------------------------------
  # Межі масштабування (з ТЗ: від 3 до 10).
  # minReplicas=3 одночасно є "дефолтом" — якщо щось пішло не так і HPA
  # не може скейлити, лишиться мінімум 3 поди.
  # ---------------------------------------------------------------------------
  minReplicas: 3
  maxReplicas: 10

  # ---------------------------------------------------------------------------
  # metrics — що моніторити для прийняття рішень.
  # CPU 70% від requests — золотий стандарт для HTTP-сервісів.
  # Можна додати memory, або кастомні метрики (RPS, queue depth тощо).
  # ---------------------------------------------------------------------------
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

  # ---------------------------------------------------------------------------
  # behavior — політика скейлінгу (як швидко додавати/прибирати).
  # ОПЦІЙНЕ поле, але корисне для prod. Без нього використовуються дефолти,
  # які можуть бути занадто агресивні (різкий scale-down).
  # ---------------------------------------------------------------------------
  behavior:
    scaleDown:
      # Стабілізація 5 хв — HPA чекає 5 хвилин після пікового навантаження,
      # перш ніж прибирати поди. Уникає "flapping" (тудисюди скейлити).
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50   # прибирати не більше 50% подів за раз
          periodSeconds: 60
    scaleUp:
      # При зростанні — реагувати швидко (60 сек стабілізації).
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100  # подвоюватись (макс) за хвилину
          periodSeconds: 60
        - type: Pods
          value: 4    # АБО додати +4 поди за хвилину
          periodSeconds: 60
      # Якщо обидві політики дозволяють — береться більше число.
      selectPolicy: Max
